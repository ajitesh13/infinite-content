  <text x="42" y="70" fill="#66645f" font-size="14" font-family="Arial,sans-serif">Illustrative screens · final verse wording, artwork and audio require review</text>
  <text x="42" y="812" fill="#45423f" font-size="16" font-family="Arial,sans-serif" font-weight="700">A · Devotional</text>
  <text x="440" y="812" fill="#45423f" font-size="16" font-family="Arial,sans-serif" font-weight="700">B · Explanatory</text>
  <text x="838" y="812" fill="#45423f" font-size="16" font-family="Arial,sans-serif" font-weight="700">C · Public comments</text>

