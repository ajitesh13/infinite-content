<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-labelledby="title desc">
  <title id="title">Geeta reels mobile app concept screens</title>
  <desc id="desc">Two reel style examples and a public comments screen for a Flutter Android app.</desc>
  <defs>
    <linearGradient id="night" x2="0" y2="1"><stop stop-color="#101a2c"/><stop offset=".55" stop-color="#263346"/><stop offset="1" stop-color="#0c111d"/></linearGradient>
