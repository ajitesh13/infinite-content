    <linearGradient id="shade" x2="0" y2="1"><stop stop-color="#000" stop-opacity="0"/><stop offset=".35" stop-color="#000" stop-opacity=".15"/><stop offset="1" stop-color="#000" stop-opacity=".88"/></linearGradient>
    <clipPath id="phone1"><rect x="42" y="92" width="320" height="680" rx="34"/></clipPath>
    <clipPath id="phone2"><rect x="440" y="92" width="320" height="680" rx="34"/></clipPath>
    <clipPath id="phone3"><rect x="838" y="92" width="320" height="680" rx="34"/></clipPath>
  </defs>
  <rect width="1200" height="840" fill="#f4f0e9"/>
